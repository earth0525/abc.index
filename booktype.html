<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>책 계열 카테고리</title>
  
  <style>
    h1,p {
        text-align : center; /*글씨중앙*/
    }
    
    .menu {
        list-style: none; /*점 제거*/
        padding: 0;
        display: flex; /*가로정렬*/
        justify-content: center; /*가운데 정렬*/
        gap: 30px; /*항목 사이 간격*/
        margin: 0;
    }

    .menu li a {
        color: white; /* 글씨 색 */
}





    /*전체 배경*/
    body {
        margin: 0;
        background-color: #e6ecf5; /* 연한 회청색 배경 */
    }

    /*헤더*/
    header {
        background-color: #2b3c4e;
        color: white;
        text-align: center;
        padding: 30px 0 10px;
    }
    
    /*서브타이틀*/
    header p {
        margin-top: 10px;
        font-size: 14px;
        color: #cbd5e0;
    }

    nav {
        background-color: #1f2d3a; /* 더 진한 남색 */
        padding: 10px 0;
        margin: 10px 0;
    }

    .container {
        display: flex;
        flex-direction: column; /* 세로 정렬 */
        justify-content: center;
        align-items: center;    /* 가로 가운데 정렬 */
        height: 60vh;           /* 화면 높이 기준 중앙 정렬을 위한 높이 설정 */
        text-align: center;
}


    .main-button {
      background-color: #2b7bbb;
      color: white;
      padding: 12px 24px;
      font-size: 16px;
      border: none; /*테두리 제거*/
      text-decoration: none; /*밑줄 제거*/
      margin: 10px 0; /* 위아래 여백 추가 */
    }

    .main-button:hover {
      background-color: #1f5d90;
    }
  </style>
</head>

<body>
      <!-- 사이트 이름 및 설명 -->
<header>
    <h1>잊혀진 책방</h1>
    <p>절판 도서 아카이브 & 독자 커뮤니티</p>
</header>

 <div class="container">
    <h2>📚 책 계열</h2>
    <a href="classics.html" class="main-button">고전문학</a>
    <a href="modern.html" class="main-button">근대문학</a>
    <a href="contemporary.html" class="main-button">현대문학</a>
    <a href="main.html" class="nav">이전으로</a>
  </div>
</body>
</html>
