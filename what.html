<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>회원가입 폼</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h2 {
      margin-top: 30px;
    }
    .form-section {
      margin-bottom: 20px;
    }
    label {
      display: inline-block;
      width: 120px;
      margin-bottom: 10px;
    }
    input[type="text"],
    input[type="password"],
    input[type="email"] {
      width: 200px;
      padding: 5px;
      margin-bottom: 10px;
    }
    .inline-btn {
      margin-left: 5px;
    }
  </style>
</head>
<body>

  <h2>기본정보 입력</h2>
  <div class="form-section">
    <label for="userid">아이디</label>
    <input type="text" id="userid" name="userid">
    <button type="button" class="inline-btn">중복확인</button><br>

    <label for="password">비밀번호</label>
    <input type="password" id="password" name="password"><br>

    <label for="confirm-password">비밀번호확인</label>
    <input type="password" id="confirm-password" name="confirm-password">
  </div>

  <h2>개인정보입력</h2>
  <div class="form-section">
    <label for="name">이름</label>
    <input type="text" id="name" name="name"><br>

    <label for="email">이메일</label>
    <input type="email" id="email" name="email">
    <button type="button" class="inline-btn">이메일인증</button><br>

    <label></label>
    <input type="checkbox" id="email-consent" name="email-consent">
    <label for="email-consent">이메일 수신 동의</label><br>

    <label for="phone">휴대전화 번호</label>
    <input type="text" id="phone" name="phone"><br>

    <label></label>
    <input type="checkbox" id="sms-consent" name="sms-consent">
    <label for="sms-consent">SMS 수신동의</label>
  </div>

</body>
</html>
