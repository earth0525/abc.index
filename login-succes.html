<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인 완료</title>
  <style>
    body {
      background-color: #e6ecf5;
    }

    .container {
      background-color: white;
      width: 450px;
      margin: 100px auto;
      padding: 40px;
      text-align: center;
    }

    h2 {
      font-size: 22px;
      color: #2b3c4e;
    }

    p {
      color: #38a169;
      margin-top: 15px;
      margin-bottom: 25px;
    }

    .main-button {
      background-color: #2b7bbb;
      color: white;
      padding: 12px 24px;
      font-size: 16px;
      border: none; /*테두리 제거*/
      text-decoration: none; /*밑줄 제거*/
    }

    .main-button:hover {
      background-color: #1f5d90;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🎉 로그인 완료되었습니다!</h2>
    <p>로그인 후 더 많은 서비스를 이용하실 수 있어요.</p>
    <a href="main.html" class="main-button">메인화면으로 가기</a>
  </div>
</body>
</html>
